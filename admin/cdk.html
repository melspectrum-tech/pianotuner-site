<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDK 管理 - Piano Tuner</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg2: #f7f8fa;
      --border: #e4e6eb;
      --text: #1c1e21;
      --text2: #65676b;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --blue: #0066cc;
      --blue-bg: #dbeafe;
      --yellow-bg: #fef9c3;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: var(--bg2);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-brand { font-size: 16px; font-weight: 700; color: var(--text); }
    .header-brand span { font-weight: 400; color: var(--text2); font-size: 13px; margin-left: 8px; }

    .header-nav { display: flex; gap: 4px; }
    .nav-link {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text2);
      text-decoration: none;
      transition: all 0.15s;
    }
    .nav-link:hover { background: var(--bg2); color: var(--text); }
    .nav-link.active { background: var(--primary); color: white; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500; border: none; cursor: pointer;
      transition: all 0.15s; text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg2); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-green { background: var(--green); color: white; }
    .btn-green:hover { background: #15803d; }
    .btn-red { background: var(--red); color: white; }
    .btn-red:hover { background: #b91c1c; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Container ── */
    .container { width: 100%; margin: 0 auto; padding: 28px 24px; }

    /* ── Login ── */
    .login-wrap {
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; background: var(--bg2);
    }
    .login-card {
      background: var(--bg); border-radius: 16px; padding: 48px 40px;
      width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
    }
    .login-logo {
      width: 56px; height: 56px; background: var(--primary); border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; color: white; font-size: 28px;
    }
    .login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-sub { font-size: 14px; color: var(--text2); margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
    .form-input {
      width: 100%; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.15s; background: var(--bg);
    }
    .form-input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; margin-top: 8px; padding: 11px; font-size: 15px; }
    .login-error {
      background: var(--red-bg); color: var(--red); border-radius: 8px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; text-align: left;
    }

    /* ── Stats Cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg); border-radius: var(--radius);
      padding: 18px 20px; border: 1px solid var(--border);
    }
    .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 28px; font-weight: 700; }
    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: var(--blue); }
    .stat-value.red { color: var(--red); }
    .stat-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: var(--text); }

    /* ── Generate Block ── */
    .generate-block {
      background: var(--bg); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 24px;
    }
    .generate-form { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
    .form-select {
      padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; background: var(--bg); color: var(--text); outline: none; cursor: pointer;
    }
    .form-select:focus { border-color: var(--primary); }
    .count-input {
      width: 80px; padding: 9px 14px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; outline: none; text-align: center;
    }
    .count-input:focus { border-color: var(--primary); }

    /* ── Type Tabs ── */
    .type-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .type-tab {
      padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text2);
      transition: all 0.15s;
    }
    .type-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* ── Filter Row ── */
    .filter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .filter-tabs { display: flex; gap: 4px; }
    .filter-tab {
      padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text2);
      transition: all 0.15s;
    }
    .filter-tab.active { background: var(--text); color: white; border-color: var(--text); }
    .result-count { font-size: 13px; color: var(--text2); }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg); border-radius: var(--radius);
      border: 1px solid var(--border); overflow-x: auto;
    }
    .table-empty {
      text-align: center; padding: 60px 20px; color: var(--text2); font-size: 14px;
    }
    .table-empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    table { table-layout: fixed; width: 100%; min-width: 900px; border-collapse: collapse; font-size: 13px; }
    thead { background: var(--bg2); border-bottom: 1px solid var(--border); }
    th {
      padding: 11px 16px; text-align: left; font-weight: 600; color: var(--text2);
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
    }
    td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    /* ── CDK Code ── */
    .cdk-code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 12px; color: var(--text); letter-spacing: 0.5px;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-unused { background: var(--blue-bg); color: var(--blue); }
    .badge-activated { background: var(--green-bg); color: var(--green); }
    .badge-revoked { background: var(--red-bg); color: var(--red); }

    .type-tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; background: var(--bg2); border: 1px solid var(--border); color: var(--text2);
    }

    .mono { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--text2); }

    /* ── Actions ── */
    .row-actions { display: flex; gap: 6px; align-items: center; }
    .btn-copy {
      background: var(--bg2); border: 1px solid var(--border); color: var(--text2);
      padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: all 0.15s;
    }
    .btn-copy:hover { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-copy.copied { background: var(--green); color: white; border-color: var(--green); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text); color: white; padding: 12px 20px;
      border-radius: 10px; font-size: 14px; z-index: 2000;
      opacity: 0; transform: translateY(10px); transition: all 0.25s;
      pointer-events: none; max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--green); }
    .toast.error { background: var(--red); }

    /* ── Loading ── */
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center; z-index: 500; display: none;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .container { padding: 16px 12px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .header { padding: 0 12px; }
      .header-nav { display: none; }
      th, td { padding: 10px 12px; }
    }
  </style>

</head>

<script>
  const API_BASE = window.location.origin;
  let token = localStorage.getItem('admin_token');
  let allCDKs = [];
  let currentType = 'all';
  let currentFilter = 'all';

  // ── Init ──
  document.addEventListener('DOMContentLoaded', () => handleLogin());

  // ── Auth ──
  async function handleLogin(e) {
    if (e) { e.preventDefault(); window.location.href = '/cdn-cgi/access/logout'; return; }
    const btn = document.getElementById('loginBtn');
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      const res = await fetch(`${API_BASE}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      });
      const data = await res.json();
      if (res.ok && data.status === 'ok' && data.token) {
        const username = data.username;
        localStorage.setItem('admin_token', data.token);
        token = data.token;
        localStorage.setItem('admin_user', username);
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('adminView').style.display = 'block';
        document.getElementById('adminUser').textContent = username;
        loadCDKs();
      } else {
        errorEl.textContent = '身份验证已过期，请重新验证身份';
        errorEl.style.display = 'block';
      }
    } catch (err) {
      errorEl.textContent = '网络错误，请稍后重试';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = '重新验证身份';
    }
  }

  function handleLogout() {
    localStorage.removeItem('admin_token');
    localStorage.removeItem('admin_user');
    token = null;
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('adminView').style.display = 'none';
    window.location.href = '/cdn-cgi/access/logout';
  }

  // ── API Helpers ──
  function getHeaders() {
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  async function apiGet(path) {
    const res = await fetch(`${API_BASE}${path}`, { headers: getHeaders() });
    if (res.status === 401) { handleLogout(); return null; }
    return res.json();
  }

  async function apiPost(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: 'POST', headers: getHeaders(), body: JSON.stringify(body)
    });
    if (res.status === 401) { handleLogout(); return null; }
    return res.json();
  }

  // ── Load CDK Data ──
  async function loadCDKs() {
    showLoading(true);
    const data = await apiGet('/api/admin/cdks');
    showLoading(false);
    if (!data) return;
    if (data.status !== 'ok') { toast('加载失败: ' + (data.message || ''), 'error'); return; }

    allCDKs = [];
    const tiers = ['pro', 'annual', 'quarterly', 'railsback', 'revoked'];
    for (const tier of tiers) {
      const items = data[tier] || [];
      for (const item of items) {
        allCDKs.push({ ...item, _tier: tier });
      }
    }

    updateStats();
    renderTable();
  }

  // ── Stats ──
  function updateStats() {
    const total = allCDKs.length;
    let activated = 0, unused = 0, revoked = 0;
    let pro = 0, annual = 0, quarterly = 0, railsback = 0;

    for (const cdk of allCDKs) {
      if (cdk.status === 'activated') activated++;
      else if (cdk.status === 'unused') unused++;
      else if (cdk.status === 'revoked') revoked++;

      if (cdk._tier === 'pro') pro++;
      else if (cdk._tier === 'annual') annual++;
      else if (cdk._tier === 'quarterly') quarterly++;
      else if (cdk._tier === 'railsback') railsback++;
    }

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPro').textContent = pro;
    document.getElementById('statAnnual').textContent = annual;
    document.getElementById('statQuarterly').textContent = quarterly;
    document.getElementById('statRailsback').textContent = railsback;
    document.getElementById('statActivated').textContent = activated;
    document.getElementById('statUnused').textContent = unused;
    document.getElementById('statRevoked').textContent = revoked;
    document.getElementById('statAll').textContent = total;
  }

  // ── Filter / Tab Logic ──
  function switchTypeTab(type) {
    currentType = type;
    document.querySelectorAll('.type-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.type === type);
    });
    renderTable();
  }

  function switchFilter(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.filter === filter);
    });
    renderTable();
  }

  function getFiltered() {
    return allCDKs.filter(cdk => {
      const typeMatch = currentType === 'all' || cdk._tier === currentType;
      const filterMatch = currentFilter === 'all' || cdk.status === currentFilter;
      return typeMatch && filterMatch;
    });
  }

  // ── Render Table ──
  function renderTable() {
    const list = getFiltered();
    const body = document.getElementById('tableBody');
    document.getElementById('resultCount').textContent = `共 ${list.length} 条`;

    if (list.length === 0) {
      body.innerHTML = `
        <tr><td colspan="6">
          <div class="table-empty">
            <div class="table-empty-icon">🔑</div>
            <div>暂无 CDK 数据</div>
          </div>
        </td></tr>`;
      return;
    }

    body.innerHTML = list.map(cdk => `
      <tr>
        <td><span class="cdk-code">${escapeHtml(cdk.code)}</span></td>
        <td><span class="type-tag">${tierLabel(cdk._tier)}</span></td>
        <td><span class="badge badge-${cdk.status}">${statusLabel(cdk.status)}</span></td>
        <td class="mono">${cdk.device_id ? escapeHtml(cdk.device_id) : '–'}</td>
        <td class="mono">${cdk.activated_at ? formatTime(cdk.activated_at) : '–'}</td>
        <td>
          <div class="row-actions">
            <button class="btn-copy" onclick="copyCDK('${escapeHtml(cdk.code)}', this)">复制</button>
            ${cdk.status === 'unused' ? `<button class="btn btn-red btn-sm" onclick="revokeCDK('${escapeHtml(cdk.code)}')">撤销</button>` : ''}
          </div>
        </td>
      </tr>
    `).join('');
  }

  function tierLabel(tier) {
    const map = { pro: 'Pro 永久', annual: '年度订阅', quarterly: '季度版', railsback: 'Railsback', revoked: '已撤销' };
    return map[tier] || tier;
  }

  function statusLabel(status) {
    const map = { unused: '未使用', activated: '已激活', revoked: '已撤销' };
    return map[status] || status;
  }

  function formatTime(iso) {
    if (!iso) return '–';
    try {
      const d = new Date(iso);
      return d.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Generate CDKs ──
  async function generateCDKs() {
    const type = document.getElementById('genType').value;
    const count = parseInt(document.getElementById('genCount').value) || 6;
    const btn = document.getElementById('genBtn');
    btn.disabled = true; btn.textContent = '生成中…';
    const data = await apiPost('/api/admin/cdk/generate', { type, count });
    btn.disabled = false; btn.textContent = '生成 CDK';
    if (!data) return;
    if (data.status === 'ok') {
      toast(`成功生成 ${data.count} 个 CDK`, 'success');
      // Show generated codes
      if (data.generated && data.generated.length > 0) {
        const codes = data.generated.join('\n');
        if (confirm('生成成功！CDK 码：\n\n' + codes + '\n\n是否复制到剪贴板？')) {
          navigator.clipboard.writeText(codes).catch(() => {});
        }
      }
      loadCDKs();
    } else {
      toast('生成失败: ' + (data.message || '未知错误'), 'error');
    }
  }

  // ── Revoke CDK ──
  async function revokeCDK(code) {
    if (!confirm(`确定要撤销 CDK：\n${code}\n\n撤销后将无法使用。`)) return;
    showLoading(true);
    const data = await apiPost('/api/admin/cdk/revoke', { cdk: code });
    showLoading(false);
    if (!data) return;
    if (data.status === 'ok') {
      toast(`CDK ${code} 已撤销`, 'success');
      loadCDKs();
    } else {
      toast('撤销失败: ' + (data.message || '未知错误'), 'error');
    }
  }

  // ── Copy ──
  async function copyCDK(code, btn) {
    try {
      await navigator.clipboard.writeText(code);
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1500);
    } catch {
      toast('复制失败', 'error');
    }
  }

  // ── Loading ──
  function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('show', show);
  }

  // ── Toast ──
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast show ${type}`;
    setTimeout(() => { el.classList.remove('show'); }, 3500);
  }
</script>
</body>
</html>
